[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retroarch-overlay"
version = "0.1.0"
description = "Read-only, plugin-driven game information overlay for RetroArch"
requires-python = ">=3.11"
dependencies = [
	"keyring>=25.0",
	"Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=9.0",
]

[project.scripts]
retroarch-overlay = "retroarch_overlay.main:main"
retroarch-overlay-cheeves = "retroarch_overlay.cheeves:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
